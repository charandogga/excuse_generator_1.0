<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Excuse Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:2rem 1rem}
h1{font-size:24px;font-weight:600;color:#f1f5f9;margin-bottom:4px}
.subtitle{font-size:14px;color:#94a3b8;margin-bottom:2rem}
.layout{display:grid;grid-template-columns:280px 1fr;gap:1.5rem;max-width:1000px;margin:0 auto}
.panel{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:1.25rem}
.panel-title{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px}
.form-group select{width:100%;padding:9px 10px;border:1px solid #334155;border-radius:8px;background:#0f172a;color:#e2e8f0;font-size:14px;outline:none;cursor:pointer}
.form-group select:focus{border-color:#3b82f6}
.btn{width:100%;padding:11px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid #334155;margin-bottom:8px;transition:all .15s;color:#e2e8f0;background:#1e293b}
.btn:hover{background:#334155}
.btn.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.btn.primary:hover{background:#2563eb}
.tabs{display:flex;gap:2px;margin-bottom:1.25rem;background:#0f172a;border-radius:8px;padding:4px}
.tab{flex:1;padding:8px;font-size:13px;cursor:pointer;border-radius:6px;border:none;background:none;color:#64748b;transition:all .15s;font-weight:500}
.tab.active{background:#1e293b;color:#e2e8f0}
.excuse-card{background:#0f172a;border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.excuse-text{font-size:15px;color:#f1f5f9;line-height:1.65;margin-bottom:1rem;font-style:italic}
.meta-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500}
.badge-blue{background:#1e3a5f;color:#60a5fa}
.badge-green{background:#14532d;color:#4ade80}
.badge-amber{background:#451a03;color:#fbbf24}
.badge-red{background:#450a0a;color:#f87171}
.badge-gray{background:#1e293b;color:#94a3b8}
.score-bar{height:4px;border-radius:2px;background:#334155;overflow:hidden}
.score-fill{height:100%;border-radius:2px;transition:width .5s ease}
.doc{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:1.25rem;font-family:'Courier New',monospace;font-size:12px;line-height:1.7;white-space:pre-wrap;color:#cbd5e1;margin-bottom:.5rem;position:relative}
.doc-label{font-size:11px;font-weight:600;color:#64748b;background:#1e293b;border:1px solid #334155;border-radius:6px;padding:3px 8px;position:absolute;top:10px;right:10px}
.copy-btn{font-size:12px;color:#94a3b8;background:#1e293b;border:1px solid #334155;border-radius:6px;padding:5px 10px;cursor:pointer;margin-bottom:1.25rem;transition:all .15s}
.copy-btn:hover{background:#334155;color:#e2e8f0}
.apology-box{background:#0f172a;border-radius:8px;padding:1.25rem;font-size:14px;line-height:1.7;color:#e2e8f0;border-left:3px solid #3b82f6;margin-bottom:.75rem}
.history-item{padding:10px 0;border-bottom:1px solid #1e293b;display:flex;gap:10px}
.history-item:last-child{border-bottom:none}
.history-num{font-size:11px;color:#475569;min-width:18px;margin-top:2px}
.history-text{font-size:13px;color:#cbd5e1;line-height:1.5}
.history-meta{font-size:11px;color:#475569;margin-top:3px}
.empty{text-align:center;padding:3rem 1rem;color:#475569;font-size:14px}
.empty-icon{font-size:32px;margin-bottom:8px}
.pane{display:none}
.pane.active{display:block}
.header{max-width:1000px;margin:0 auto 1.5rem}
@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header">
  <h1>🛡️ AI Excuse Generator</h1>
  <p class="subtitle">Generate contextual excuses with supporting proof documents</p>
</div>

<div class="layout">
  <div>
    <div class="panel">
      <div class="panel-title">Configure</div>
      <div class="form-group">
        <label>Situation</label>
        <select id="cat">
          <option value="work">Work / Office</option>
          <option value="school">School / College</option>
          <option value="social">Social event</option>
          <option value="family">Family obligation</option>
          <option value="emergency">Emergency</option>
        </select>
      </div>
      <div class="form-group">
        <label>Excuse type</label>
        <select id="subcat">
          <option value="medical">Medical / Health</option>
          <option value="family">Family issue</option>
          <option value="transport">Transport / Vehicle</option>
          <option value="home">Home emergency</option>
          <option value="technical">Technical problem</option>
          <option value="personal">Personal matter</option>
        </select>
      </div>
      <div class="form-group">
        <label>Urgency</label>
        <select id="urgency">
          <option value="low">Low — flexible timing</option>
          <option value="medium" selected>Medium — same day</option>
          <option value="high">High — immediate</option>
          <option value="critical">Critical — emergency</option>
        </select>
      </div>
      <div class="form-group">
        <label>Apology tone</label>
        <select id="apology_type">
          <option value="professional">Professional</option>
          <option value="casual">Casual / Friendly</option>
          <option value="formal">Formal / Written</option>
          <option value="empathetic">Empathetic</option>
        </select>
      </div>
      <button class="btn primary" onclick="generateAll()">⚡ Generate excuse + proof</button>
      <button class="btn" onclick="showTab('history')">📋 View history</button>
    </div>
  </div>

  <div class="panel">
    <div class="tabs">
      <button class="tab active" onclick="showTab('excuse')" id="tab-excuse">Excuse</button>
      <button class="tab" onclick="showTab('apology')" id="tab-apology">Apology</button>
      <button class="tab" onclick="showTab('proof')" id="tab-proof">Proof docs</button>
      <button class="tab" onclick="showTab('history')" id="tab-history">History</button>
    </div>
    <div id="pane-excuse" class="pane active"><div class="empty"><div class="empty-icon">👆</div>Configure and click generate</div></div>
    <div id="pane-apology" class="pane"><div class="empty">Generate an excuse first</div></div>
    <div id="pane-proof" class="pane"><div class="empty">Generate an excuse first</div></div>
    <div id="pane-history" class="pane"><div class="empty">No history yet</div></div>
  </div>
</div>

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function ref(){return String(Math.floor(Math.random()*900000)+100000)}
function today(){return new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'})}

function believability(cat,sub,urg){
  let s=0.65;
  if(cat==='work'||cat==='emergency')s+=0.1;
  if(sub==='medical')s+=0.15;
  else if(sub==='family')s+=0.1;
  if(urg==='high'||urg==='critical')s+=0.1;
  const overuse=history.filter(e=>e.sub===sub).length;
  if(overuse>2)s-=0.15;
  return Math.min(Math.max(s,0.1),1.0);
}

function scoreInfo(s){
  if(s>=0.85)return{color:'#4ade80',cls:'badge-green',label:'Very convincing'};
  if(s>=0.70)return{color:'#60a5fa',cls:'badge-blue',label:'Convincing'};
  if(s>=0.55)return{color:'#fbbf24',cls:'badge-amber',label:'Plausible'};
  return{color:'#f87171',cls:'badge-red',label:'Risky'};
}

function buildApology(text,type){
  const m={
    professional:[
      `I sincerely apologise for the short notice. ${text} I will ensure all outstanding matters are handled as a priority upon my return.`,
      `Please accept my sincere apologies for any inconvenience. ${text} I will make sure nothing is left unattended during my absence.`
    ],
    casual:[
      `Hey, really sorry about this! ${text} I'll absolutely make it up to you.`,
      `So sorry for the last-minute notice — ${text} Hope you understand!`
    ],
    formal:[
      `Dear [Name],\n\nI write to formally notify you of my inability to attend today. ${text}\n\nI apologise sincerely for any inconvenience caused and will ensure a smooth handover of all pending matters.\n\nYours sincerely,\n[Your Name]`
    ],
    empathetic:[
      `I completely understand how inconvenient this is and I'm truly sorry for the impact on everyone. ${text} I genuinely wouldn't do this unless I had absolutely no other option.`,
      `I feel awful about this and I know the timing couldn't be worse. ${text} Thank you so much for your understanding — it really does mean a lot.`
    ]
  };
  return pick(m[type]||m.professional);
}

function generateAll(){
  const cat=document.getElementById('cat').value;
  const sub=document.getElementById('subcat').value;
  const urg=document.getElementById('urgency').value;
  const apt=document.getElementById('apology_type').value;
  const pool=(excuseData[cat]&&excuseData[cat][sub]&&excuseData[cat][sub].length)?excuseData[cat][sub]:excuseData[cat][Object.keys(excuseData[cat])[0]];
  const text=pick(pool);
  const s=believability(cat,sub,urg);
  const si=scoreInfo(s);
  const r=ref();
  const d=today();
  const keys=proofByType[sub]||proofByType.personal;
  const docs=keys.map(k=>({label:proofTemplates[k].label,content:proofTemplates[k].gen(d,r)}));
  current={text,cat,sub,urg,s,si,r,d,docs,apology:buildApology(text,apt),apt};
  history.unshift({text,cat,sub,urg,s,d});
  if(history.length>50)history.pop();
  renderExcuse();renderApology();renderProof();renderHistory();
  showTab('excuse');
}

function renderExcuse(){
  if(!current)return;
  document.getElementById('pane-excuse').innerHTML=`
<div class="excuse-card">
  <div class="excuse-text">"${current.text}"</div>
  <div class="meta-row">
    <span class="badge badge-blue">${current.cat}</span>
    <span class="badge badge-blue">${current.sub}</span>
    <span class="badge ${current.si.cls}">${current.si.label} — ${Math.round(current.s*100)}%</span>
    <span class="badge badge-gray">${current.urg} urgency</span>
  </div>
  <div class="score-bar"><div class="score-fill" style="width:${Math.round(current.s*100)}%;background:${current.si.color}"></div></div>
</div>
<p style="font-size:13px;color:#64748b;margin-top:4px">📄 ${current.docs.length} proof document${current.docs.length!==1?'s':''} generated — see <strong>Proof docs</strong> tab</p>`;
}

function renderApology(){
  if(!current)return;
  document.getElementById('pane-apology').innerHTML=`
<p style="font-size:12px;color:#64748b;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.06em">${current.apt} tone</p>
<div class="apology-box">${current.apology.replace(/\n/g,'<br>')}</div>
<button class="copy-btn" onclick="copyText(this,${JSON.stringify(current.apology)})">📋 Copy message</button>`;
}

function renderProof(){
  if(!current)return;
  if(!current.docs.length){document.getElementById('pane-proof').innerHTML='<div class="empty">No proof documents for this type.</div>';return;}
  document.getElementById('pane-proof').innerHTML=current.docs.map(d=>`
<div class="doc"><div class="doc-label">${d.label}</div>${d.content}</div>
<button class="copy-btn" onclick="copyText(this,${JSON.stringify(d.content)})">📋 Copy document</button>
<div style="height:1rem"></div>`).join('');
}

function renderHistory(){
  if(!history.length){document.getElementById('pane-history').innerHTML='<div class="empty">No history yet</div>';return;}
  document.getElementById('pane-history').innerHTML=history.slice(0,20).map((e,i)=>{
    const si=scoreInfo(e.s);
    return `<div class="history-item"><div class="history-num">${i+1}</div><div><div class="history-text">${e.text}</div><div class="history-meta">${e.cat} · ${e.sub} · <span class="badge ${si.cls}" style="font-size:10px;padding:1px 6px">${si.label}</span> · ${e.d}</div></div></div>`;
  }).join('');
}

function showTab(name){
  ['excuse','apology','proof','history'].forEach(t=>{
    document.getElementById('pane-'+t).classList.toggle('active',t===name);
    const btn=document.getElementById('tab-'+t);
    if(btn)btn.classList.toggle('active',t===name);
  });
}

function copyText(btn,text){
  navigator.clipboard.writeText(text).then(()=>{
    const o=btn.innerHTML;
    btn.innerHTML='✅ Copied!';
    setTimeout(()=>{btn.innerHTML=o},1800);
  }).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const o=btn.innerHTML;
    btn.innerHTML='✅ Copied!';
    setTimeout(()=>{btn.innerHTML=o},1800);
  });
}
</script>
